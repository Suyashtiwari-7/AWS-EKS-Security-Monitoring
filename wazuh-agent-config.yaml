apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-agent-config
  namespace: wazuh
data:
  ossec.conf: |-
    <ossec_config>
      <client>
        <server>
          <address><WAZUH_MANAGER_IP></address>
          <port>1514</port>
        </server>
        <enrollment>
          <enabled>yes</enabled>
          <manager_address><WAZUH_MANAGER_IP></manager_address>
          <agent_name>nginx-eks-pod</agent_name>
        </enrollment>
      </client>

      <!-- Monitor Nginx Access Logs -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/logs/nginx/access.log</location>
      </localfile>

      <!-- Monitor Trivy Vulnerability Reports (JSON format) -->
      <localfile>
        <log_format>json</log_format>
        <location>/logs/trivy/reports.json</location>
      </localfile>

      <!-- Monitor Falco logs (via local UDP listener) -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/ossec/logs/falco.log</location>
      </localfile>

      <!-- Monitor Kubernetes Events (JSON format) -->
      <localfile>
        <log_format>json</log_format>
        <location>/var/ossec/logs/k8s_events.log</location>
      </localfile>
    </ossec_config>
  falco_listener.py: |-
    import socket
    import threading
    from http.server import HTTPServer, BaseHTTPRequestHandler

    def listen_udp(port, log_path, name):
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.bind(('0.0.0.0', port))
        print(f"{name} UDP listener started on port {port}...")
        with open(log_path, 'a', encoding='utf-8') as f:
            while True:
                data, addr = s.recvfrom(65535)
                log_line = data.decode('utf-8').strip()
                if '{' in log_line:
                    log_line = log_line[log_line.find('{'):]
                f.write(log_line + '\n')
                f.flush()

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)
            log_line = post_data.decode('utf-8').strip()
            with open('/var/ossec/logs/k8s_events.log', 'a', encoding='utf-8') as f:
                f.write(log_line + '\n')
                f.flush()
            self.send_response(200)
            self.end_headers()

        def log_message(self, format, *args):
            return

    def listen_http(port):
        server = HTTPServer(('0.0.0.0', port), WebhookHandler)
        print(f"Kubernetes Events HTTP webhook listener started on port {port}...")
        server.serve_forever()

    def main():
        t1 = threading.Thread(target=listen_udp, args=(5140, '/var/ossec/logs/falco.log', 'Falco'))
        t2 = threading.Thread(target=listen_http, args=(5141,))
        t1.daemon = True
        t2.daemon = True
        t1.start()
        t2.start()
        t1.join()
        t2.join()

    if __name__ == '__main__':
        main()
