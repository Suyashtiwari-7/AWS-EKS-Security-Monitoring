apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-event-exporter
  namespace: wazuh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-event-exporter
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-event-exporter
subjects:
- kind: ServiceAccount
  name: kubernetes-event-exporter
  namespace: wazuh
roleRef:
  kind: ClusterRole
  name: kubernetes-event-exporter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter-config
  namespace: wazuh
data:
  config.yaml: |
    logLevel: info
    logFormat: json
    maxEventAgeSeconds: 60
    kubeQPS: 100
    kubeBurst: 500
    route:
      routes:
        - match:
            - receiver: wazuh-syslog
    receivers:
      - name: wazuh-syslog
        webhook:
          endpoint: "http://falco-receiver-svc.wazuh.svc.cluster.local:5141/"
          layout:
            message: "{{ .Message }}"
            reason: "{{ .Reason }}"
            type: "{{ .Type }}"
            count: "{{ .Count }}"
            involvedObject:
              kind: "{{ .InvolvedObject.Kind }}"
              name: "{{ .InvolvedObject.Name }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-event-exporter
  namespace: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-event-exporter
  template:
    metadata:
      labels:
        app: kubernetes-event-exporter
    spec:
      serviceAccountName: kubernetes-event-exporter
      containers:
      - name: exporter
        image: ghcr.io/resmoio/kubernetes-event-exporter:latest
        imagePullPolicy: IfNotPresent
        args:
        - -conf=/etc/event-exporter/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/event-exporter
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: event-exporter-config
